<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — CineBhai</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><main class="admin-shell"><a class="brand" href="index.html"><span>CineBhai</span></a><section id="loginPanel" class="auth-card"><p class="kicker">PRIVATE AREA</p><h1>Admin sign in</h1><p class="muted">Use the Firebase email and password account created for your CineBhai admin.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" required autocomplete="username"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label><button class="button primary" type="submit">Sign in</button><p id="loginError" class="error"></p></form></section><section id="dashboard" class="dashboard hidden"><div class="dashboard-head"><div><p class="kicker">CONTENT MANAGEMENT</p><h1>Movie library</h1><p class="muted">Edit any movie and choose exactly where it appears.</p></div><button id="logoutButton" class="button">Sign out</button></div><form id="movieForm" class="admin-form"><input id="movieId" type="hidden"><label>Title<input id="title" required></label><label>Year<input id="year" required type="number" min="1900" max="2100"></label><label>Genre<input id="genre" required placeholder="Action, Drama"></label><label>Rating<input id="rating" type="number" min="0" max="10" step="0.1"></label><label class="wide">Description<textarea id="description" required rows="4"></textarea></label><label class="wide">Poster direct URL<input id="posterUrl" required type="url" placeholder="https://i.ibb.co/.../poster.jpg"></label><label class="wide">Streaming embed URL or iframe code<textarea id="embedCode" required rows="3" placeholder="https://www.youtube.com/embed/... or <iframe ...></iframe>"></textarea></label><fieldset class="visibility-options"><legend>Publish this movie in</legend><label class="check"><input id="showTrending" type="checkbox"> Trending</label><label class="check"><input id="showCatalog" type="checkbox" checked> All movies</label><label class="check"><input id="showSearch" type="checkbox" checked> Search</label></fieldset><div class="form-actions"><button class="button primary" type="submit">Save movie</button><button id="cancelEdit" class="button hidden" type="button">Cancel edit</button></div><p id="formMessage" class="muted"></p></form><div class="table-wrap"><table><thead><tr><th>Movie</th><th>Year</th><th>Genre</th><th>Sections</th><th></th></tr></thead><tbody id="movieRows"></tbody></table></div></section></main><script type="module" src="admin.js"></script></body></html>
