<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Results — CineBhai</title>
  <meta name="theme-color" content="#08080c">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"></header>

  <main class="page">
    <section class="page-intro">
      <div class="page-intro-header">
        <div>
          <p class="kicker">SEARCH RESULTS</p>
          <h1 id="searchHeading">Search Movies</h1>
          <p class="muted" id="searchSubheading">Matching titles, genres, and stories across the CineBhai catalog.</p>
        </div>
        <div>
          <span class="muted" id="searchCount"></span>
        </div>
      </div>
    </section>

    <section class="catalog-section">
      <div id="allGrid" class="movie-grid"></div>
      <div id="allEmpty" class="empty-state hidden">
        <div class="empty-icon">🔍</div>
        <h3>No matching movies found</h3>
        <p>Try searching with different keywords, genres, or actor names.</p>
        <a class="button secondary" href="index.html">← Return to Home</a>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="site.js"></script>
  <script>
    const query = new URLSearchParams(window.location.search).get('q') || '';
    if (query) {
      document.title = `Search: "${query}" — CineBhai`;
      const heading = document.getElementById('searchHeading');
      if (heading) heading.textContent = `Results for “${query}”`;
    }
  </script>
</body>
</html>
