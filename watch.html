<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Player — CineBhai</title>
  <meta name="theme-color" content="#08080c">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"></header>

  <main class="page watch-layout">
    <div id="watchContainer">
      <div class="empty-state" style="margin: 40px auto; max-width: 600px;">
        <div class="skeleton-line skeleton-shimmer" style="width: 80%; height: 32px; margin: 0 auto 16px;"></div>
        <div class="skeleton-line skeleton-shimmer" style="width: 50%; height: 18px; margin: 0 auto;"></div>
      </div>
    </div>

    <!-- Up Next / Suggested Titles -->
    <section id="upNextSection" class="catalog-section" style="display: none;">
      <div class="section-head">
        <h2>Up Next & Recommended</h2>
      </div>
      <div id="upNextGrid" class="movie-grid"></div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="watch.js"></script>
</body>
</html>
